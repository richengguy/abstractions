name: Publish Docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install build dependencies
        id: install-deps
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod u+x ./llvm.sh
          sudo ./llvm.sh 19
          sudo apt install doxygen
          uv sync --group docs
          echo "CONAN_CONFIG_HOME=$(uv run conan config home)" >> "$GITHUB_OUTPUT"

      - name: Restore Conan build cache
        id: conan-restore-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.install-deps.outputs.CONAN_CONFIG_HOME }}
          key: ${{ runner.os }}-conan-cache

      - name: Install app dependencies
        run: |
          uv run conan install . -pr:a ./profiles/linux-x86_64 --build=missing -o "&:build_docs=True"

      - name: Build documentation
        run: |
          uv run cmake --preset conan-release
          uv run cmake --build --preset conan-release --target docs

      - name: Package documentation
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/Release/docs/sphinx/

