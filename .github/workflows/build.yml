name: PR Lint, Build, and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/run-linter
        with:
          cmd: python ./scripts/run-clang-format
          sources: include src
          check-args: --check
          diff-args: --diff
          diff-lang: cpp

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/run-linter
        with:
          cmd: black
          sources: conanfile.py scripts/run-mypy scripts/run-clang-format
          check-args: --check
          diff-args: --diff
          diff-lang: python

  build-cpp:
    runs-on: ubuntu-latest
    needs: lint-cpp
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install build dependencies
        id: install-deps
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod u+x ./llvm.sh
          sudo ./llvm.sh 19
          uv sync
          echo "CONAN_CONFIG_HOME=$(uv run conan config home)" >> "$GITHUB_OUTPUT"

      - name: Restore Conan build cache
        id: conan-restore-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.install-deps.outputs.CONAN_CONFIG_HOME }}
          key: ${{ runner.os }}-conan-cache

      - name: Install app dependencies
        run: |
          uv run conan install . -pr:a ./profiles/debian-x86_64 --build=missing

      - name: Save Conan build cache
        id: conan-save-cache
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.install-deps.outputs.CONAN_CONFIG_HOME }}
          key: ${{ steps.conan-restore-cache.outputs.cache-primary-key }}

      - name: Build project
        run: |
          uv run cmake --preset conan-release
          uv run cmake --build --preset conan-release

      - name: Run project tests
        run: |
          cd build/Release
          uv run ctest
        timeout-minutes: 5
